[tool.pytest.ini_options]
# Make the shared Python mirror packages importable without installation.
pythonpath = [
    "packages/types/python",
    "packages/contracts/python",
    "packages/validation/python",
    "packages/spatial/python",
    "services/blender-mcp",
    "services/blender-worker",
    "tests/fixtures",
]
testpaths = [
    "packages",
    "services",
    "tests",
]
python_files = ["test_*.py", "*_test.py"]

# Real-Blender integration tests are opt-in: they launch Blender and are far
# slower than the unit suite. Run them with:  pytest -m blender
addopts = "-m 'not blender'"
markers = [
    "blender: requires a real Blender executable (opt-in, slow)",
]
