[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-3d-design-studio"
version = "0.0.1"
description = "Browser-based AI 3D design studio (monorepo, Python services)."
requires-python = ">=3.11"

# Runtime dependencies.
#
# `websockets` is required by the worker <-> control-plane transport
# (services/blender-worker/.../link and services/api/.../worker_link) AND by
# uvicorn to serve the /ws/workers endpoint, so one pinned version covers both
# ends of the link.
#
# `fastapi` brings starlette and pydantic; `uvicorn` is the ASGI server the
# control plane is run with. Both are genuine runtime dependencies of
# services/api, not development tooling. Pinned exactly so a deployment cannot
# drift from what was tested.
#
# `mcp` is the official Model Context Protocol client SDK (MIT). The worker uses it
# to speak MCP over stdio to the OFFICIAL Blender Lab MCP server, which runs as a
# separate pinned process installed by scripts/setup_official_blender_mcp.py. We
# depend on the CLIENT SDK only; the official server is never imported.
#
# `pypdfium2` renders PDF pages to images and extracts native text (BSD/Apache,
# no external binary, no OCR). `pillow` validates and normalises uploaded images
# and encodes rendered PDF pages to PNG.
dependencies = [
    "websockets==15.0.1",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "python-multipart==0.0.20",
    "mcp==1.30.0",
    "pypdfium2==5.13.0",
    "pillow==12.1.0",
]

[project.optional-dependencies]
# Development-only tooling. Deliberately separate so test tooling never becomes a
# production dependency.
#
# `httpx` backs starlette's TestClient, which the fast API tests use to drive the
# application in-process without binding a port.
dev = [
    "pytest>=8",
    "httpx==0.28.1",
]

# Multi-root package discovery.
#
# Each Python package lives beside the package or service that owns it, which
# setuptools' automatic discovery cannot infer. Rather than restructuring the
# monorepo to satisfy the build backend, every package is mapped explicitly to its
# existing source directory. Nothing is copied or duplicated, and an editable
# install resolves each package at its real location.
#
# Non-package assets (packages/contracts/schemas, blender_worker/blender_scripts)
# are located at runtime relative to `__file__`, which points at the real source
# tree under an editable install, so they need no packaging entry.
[tool.setuptools]
packages = [
    "studio_types",
    "studio_contracts",
    "studio_validation",
    "studio_spatial",
    "studio_materials",
    "studio_agent",
    "studio_agent.providers",
    "studio_api",
    "studio_api.routes",
    "studio_api.worker_link",
    "studio_api.storage",
    "studio_api.ingest",
    "studio_preview",
    "blender_mcp",
    "blender_mcp.adapters",
    "blender_mcp.tools",
    "blender_worker",
    "blender_worker.link",
    "blender_worker.capability",
    "blender_worker.backends",
    "blender_worker.backends.official",
]

[tool.setuptools.package-dir]
studio_types = "packages/types/python/studio_types"
studio_contracts = "packages/contracts/python/studio_contracts"
studio_validation = "packages/validation/python/studio_validation"
studio_spatial = "packages/spatial/python/studio_spatial"
studio_materials = "packages/materials/python/studio_materials"
studio_agent = "services/agent/studio_agent"
"studio_agent.providers" = "services/agent/studio_agent/providers"
studio_preview = "services/preview/studio_preview"
studio_api = "services/api/studio_api"
"studio_api.routes" = "services/api/studio_api/routes"
"studio_api.worker_link" = "services/api/studio_api/worker_link"
blender_mcp = "services/blender-mcp/blender_mcp"
"blender_mcp.adapters" = "services/blender-mcp/blender_mcp/adapters"
"blender_mcp.tools" = "services/blender-mcp/blender_mcp/tools"
blender_worker = "services/blender-worker/blender_worker"
"blender_worker.link" = "services/blender-worker/blender_worker/link"
"blender_worker.capability" = "services/blender-worker/blender_worker/capability"
"blender_worker.backends" = "services/blender-worker/blender_worker/backends"
"blender_worker.backends.official" = "services/blender-worker/blender_worker/backends/official"

[tool.pytest.ini_options]
# The runtime packages come from the editable install, not from here. Only the
# test-only tooling needs a path entry, because it is test tooling rather than a
# runtime package and is deliberately not installed:
#   tests/fixtures            -> studio_fixtures (Blender seed fixture helpers)
#   packages/spatial/python   -> spatial_test_support (shared corpus loader)
#
# `spatial_test_support` was previously importable only by accident: pytest prepends
# the directory of each collected test file, so `packages/spatial/python/test_*.py`
# happened to put it on sys.path before `tests/spatial/` was collected. That made
# `pytest tests/spatial` alone fail with an ImportError depending on collection
# order. Declaring it here makes every spatial suite runnable on its own.
pythonpath = [
    "tests/fixtures",
    "packages/spatial/python",
]
testpaths = [
    "packages",
    "services",
    "tests",
]
python_files = ["test_*.py", "*_test.py"]

# Real-Blender integration tests are opt-in: they launch Blender and are far
# slower than the unit suite. Run them with:  pytest -m blender
addopts = "-m 'not blender and not mcp and not codex'"
markers = [
    "blender: requires a real Blender executable (opt-in, slow)",
    "mcp: requires the pinned official Blender MCP server and a real Blender (opt-in, slow)",
    "codex: requires a real Codex CLI with an active ChatGPT login (opt-in, costs credits)",
]
